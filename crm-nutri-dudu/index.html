<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutri Dudu — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  // Aplica o tema escolhido antes de desenhar a página (evita piscar claro → escuro).
  try {
    var tema = localStorage.getItem('nutridudu:tema');
    if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
  } catch (erro) { /* sem armazenamento: segue o sistema */ }
</script>
</head>
<body>

<!-- Login (só quando o sistema está ligado à nuvem) -->
<div class="tela-login" id="tela-login" hidden>
  <div class="login-cartao">
    <div class="login-marca">
      <span class="brand-logo">ND</span>
      <span class="brand-name">Nutri Dudu</span>
    </div>
    <div id="login-conteudo"></div>
  </div>
</div>

<div class="aviso-demo" id="aviso-demo" hidden>
  <strong>Modo demonstração:</strong> dados fictícios, salvos só neste navegador — não use com pacientes reais.
  <a href="index.html">Ir para o sistema</a>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <a href="#/" class="brand">
      <span class="brand-logo">ND</span>
      <span class="brand-name">Nutri Dudu</span>
    </a>

    <nav class="nav" aria-label="Menu principal">
      <a href="#/" class="nav-link" data-menu="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#/agenda" class="nav-link" data-menu="agenda">

        <span>Agenda</span>
      </a>
      <a href="#/kanban/comercial" class="nav-link" data-menu="kanban">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>
        <span>Kanban</span>
      </a>
      <a href="#/clientes" class="nav-link" data-menu="clientes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5.5-4-6.5"/></svg>
        <span>Clientes</span>
      </a>
      <a href="#/conversas" class="nav-link" data-menu="conversas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z"/></svg>
        <span>Conversas</span>
      </a>
      <a href="#/servicos" class="nav-link" data-menu="servicos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="M8 10h8M8 14h5"/><circle cx="18" cy="17" r="3"/></svg>
        <span>Serviços</span>
      </a>
      <a href="#/configuracoes" class="nav-link" data-menu="configuracoes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn-link" id="btn-reset">Restaurar dados de exemplo</button>
      <p class="muted small" id="rodape-modo">Protótipo · dados fictícios salvos neste navegador</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="busca-global" placeholder="Buscar cliente por nome, telefone ou e-mail…" autocomplete="off" aria-label="Buscar cliente">
        <div class="search-results" id="busca-resultados" hidden></div>
      </div>

      <div class="topbar-actions">
        <label class="perfil-select" id="perfil-simulado">
          <span class="muted small">Ver como</span>
          <select id="perfil" aria-label="Perfil simulado"></select>
        </label>

        <div class="usuario-menu" id="usuario-menu" hidden>
          <button type="button" class="btn usuario-botao" id="btn-usuario" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="usuario-iniciais" aria-hidden="true"></span>
            <span class="usuario-nome" id="usuario-nome"></span>
          </button>
          <div class="dropdown" id="menu-usuario" hidden>
            <p class="dropdown-info"><span id="usuario-email"></span><br><span class="muted" id="usuario-papel"></span></p>
            <button type="button" data-usuario="senha">Trocar senha</button>
            <button type="button" data-usuario="sair">Sair</button>
          </div>
        </div>

        <button type="button" class="btn btn-tema" id="btn-tema" aria-label="Usar modo escuro" title="Usar modo escuro">
          <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

        <div class="new-menu">
          <button type="button" class="btn btn-primary" id="btn-novo" aria-haspopup="true" aria-expanded="false">+ Novo</button>
          <div class="dropdown" id="menu-novo" hidden>
            <button type="button" data-novo="lead">Lead</button>
            <button type="button" data-novo="cliente">Cliente</button>
            <button type="button" data-novo="consulta">Consulta</button>
            <button type="button" data-novo="pagamento">Pagamento</button>
            <button type="button" data-novo="pacote">Pacote</button>
          </div>
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="toast-area" id="toast-area" aria-live="polite"></div>
