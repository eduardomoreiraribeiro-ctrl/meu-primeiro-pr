<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f7f6">
<title>Meu acompanhamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/area-paciente.css?v=1">
<style>
  :root { --bg: #eef3f0; --text: #17211b; --text-muted: #55625b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1311; --surface: #161d19; --surface-2: #1f2823; --border: #2c3731; --text: #e3eae6; --text-muted: #a3b0a8;
      --primary: #22c55e; --primary-soft: #14301f; --sobre-primaria: #06210f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.5; }
  main { padding: 20px 16px 40px; }
  .aviso { max-width: 460px; margin: 40px auto; text-align: center; color: var(--text-muted); }
  .aviso strong { display: block; color: var(--text); font-size: 1.15rem; margin-bottom: 6px; }
  .small { font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <div id="area"><p class="aviso">Carregando…</p></div>
</main>
<script src="js/nuvem-config.js?v=2"></script>
<script src="js/checkin.js?v=7"></script>
<script src="js/area-paciente-tela.js?v=4"></script>
<script src="js/area-paciente-pagina.js?v=2"></script>
</body>
</html>
